name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install functions dependencies
        run: |
          if [ -f functions/package.json ]; then
            cd functions
            npm ci
          fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Stamp deploy version
        run: |
          VERSION="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          printf '{\n  "version": "%s"\n}\n' "$VERSION" > version.json
          echo "Deploy version: $VERSION"

      - name: Deploy hosting, functions, rules, and indexes
        env:
          PROJECT_ID: foco-after-dark
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          for attempt in 1 2 3; do
            firebase deploy --project "$PROJECT_ID" --only hosting,functions,firestore:rules,firestore:indexes && exit 0
            echo "Deploy attempt ${attempt} failed; retrying in 30s..."
            sleep 30
          done
          echo "Deploy failed after 3 attempts."
          exit 1
